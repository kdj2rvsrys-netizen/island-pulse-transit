<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f8">
  <title>Island Pulse｜台灣交通 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102a43;
      --route: #008f91;
      --signal: #ffc857;
      --canvas: #eaf2f3;
      --panel: #ffffff;
      --text: #142b3b;
      --muted: #617582;
      --line: #d7e1e5;
      --incident: #d64545;
      --roadwork: #d9822b;
      --closure: #7a3e9d;
      --congestion: #b58b00;
      --camera: #2864b4;
      --shadow: 0 12px 36px rgba(17, 42, 61, .12);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--text); background: var(--canvas); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #006f78; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .app { display: grid; grid-template-columns: 68px 286px minmax(380px, 1fr) 320px; grid-template-rows: 66px minmax(0, 1fr); height: 100dvh; min-height: 620px; overflow: hidden; background: var(--panel); }
    .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 22px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.97); z-index: 5; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 215px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; color: white; background: var(--ink); }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font-weight: 800; letter-spacing: -.03em; font-size: 15px; line-height: 1.05; }
    .brand-name small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .11em; }
    .search { height: 40px; max-width: 500px; flex: 1; display: flex; align-items: center; gap: 9px; padding: 0 12px; color: #738691; background: #f3f7f8; border: 1px solid #e3eaed; border-radius: 10px; }
    .search svg { width: 17px; height: 17px; flex: none; }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 13px; }
    .search input::placeholder { color: #738691; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .demo-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; color: #684d00; background: #fff4cf; border: 1px solid #f5dfa0; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .demo-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #c38a00; }
    .status-select { height: 36px; max-width: 178px; padding: 0 28px 0 10px; color: #425965; background-color: #fff; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; }
    .icon-button { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: white; cursor: pointer; }
    .icon-button svg { width: 18px; height: 18px; }
    .rail { grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 8px; border-right: 1px solid var(--line); background: #fbfcfc; z-index: 3; }
    .rail-spacer { flex: 1; }
    .nav-item { width: 50px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 5px 1px; color: #6a7c87; border: 0; border-radius: 12px; background: transparent; cursor: pointer; font-size: 9px; font-weight: 650; }
    .nav-item svg { width: 20px; height: 20px; }
    .nav-item[aria-current="page"] { color: #006d70; background: #e3f4f2; }
    .sidebar { grid-row: 2; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: white; z-index: 2; }
    .side-head { padding: 19px 18px 13px; }
    .eyebrow { color: #788a94; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .side-head h1 { margin: 6px 0 4px; font-size: 19px; letter-spacing: -.03em; }
    .subline { color: var(--muted); font-size: 11px; }
    .layer-title { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 8px; font-size: 11px; font-weight: 800; }
    .quiet-button { padding: 4px 0; color: #007d7c; border: 0; background: transparent; cursor: pointer; font-size: 10px; font-weight: 750; }
    .layer-list { display: grid; gap: 3px; padding: 0 10px 12px; }
    .layer-toggle { min-height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 9px; border: 1px solid transparent; border-radius: 9px; background: white; cursor: pointer; text-align: left; }
    .layer-toggle:hover { background: #f6f9fa; }
    .layer-toggle[aria-pressed="true"] { border-color: #e5ecee; background: #f8fafb; }
    .layer-toggle[aria-pressed="false"] { opacity: .5; }
    .layer-toggle .label { flex: 1; font-size: 12px; font-weight: 700; }
    .layer-toggle .count { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .switch { width: 28px; height: 16px; position: relative; border-radius: 999px; background: #c8d4d9; transition: background .18s ease; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: white; transition: transform .18s ease; box-shadow: 0 1px 2px #0002; }
    .layer-toggle[aria-pressed="true"] .switch { background: var(--route); }
    .layer-toggle[aria-pressed="true"] .switch::after { transform: translateX(12px); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--event-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--event-color) 14%, transparent); }
    .section-line { height: 1px; margin: 1px 17px 0; background: var(--line); }
    .list-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px 7px; }
    .list-head strong { font-size: 11px; }
    .list-head span { color: var(--muted); font-size: 10px; }
    .event-list { min-height: 0; overflow-y: auto; padding: 0 8px 14px; }
    .event-row { width: 100%; display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 9px; padding: 10px 9px; border: 1px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; }
    .event-row:hover { background: #f7f9fa; }
    .event-row[aria-pressed="true"] { border-color: #b9dfdc; background: #eff9f8; }
    .event-glyph { width: 28px; height: 28px; display: grid; place-items: center; color: white; background: var(--event-color); border-radius: 9px; font-size: 12px; font-weight: 900; }
    .event-copy { min-width: 0; }
    .event-copy strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .event-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .event-age { color: #758791; font-size: 9px; white-space: nowrap; }
    .map-stage { grid-row: 2; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #e7f1f1; }
    .map-canvas { position: absolute; inset: 0; overflow: hidden; background: #e6f0f0; }
    .map-art { width: 100%; height: 100%; display: block; }
    .map-topline { position: absolute; top: 16px; left: 18px; display: flex; align-items: center; gap: 8px; z-index: 1; }
    .map-chip { min-height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 11px; color: #29404d; background: rgba(255,255,255,.96); border: 1px solid #dbe5e8; border-radius: 9px; box-shadow: 0 2px 9px #1a344414; font-size: 10px; font-weight: 750; }
    .map-chip svg { width: 14px; height: 14px; color: #53707d; }
    .fresh-dot { width: 7px; height: 7px; border-radius: 50%; background: #c38a00; }
    .map-controls { position: absolute; top: 16px; right: 16px; display: grid; gap: 7px; z-index: 1; }
    .map-controls .icon-button { box-shadow: 0 2px 9px #1a344414; }
    .map-label { position: absolute; color: #496675; font-size: 10px; font-weight: 750; letter-spacing: .06em; text-shadow: 0 1px #fff, 1px 0 #fff, 0 -1px #fff, -1px 0 #fff; pointer-events: none; }
    .map-label.subdued { color: #758e94; font-size: 9px; font-weight: 600; }
    .marker { --event-color: var(--incident); position: absolute; width: 42px; height: 42px; display: grid; place-items: center; padding: 0; color: #fff; border: 3px solid rgba(255,255,255,.98); border-radius: 50%; background: var(--event-color); box-shadow: 0 3px 12px #15324538; cursor: pointer; transform: translate(-50%,-50%); transition: transform .16s ease, box-shadow .16s ease; z-index: 2; }
    .marker:hover, .marker:focus-visible { transform: translate(-50%,-50%) scale(1.12); box-shadow: 0 0 0 5px color-mix(in srgb, var(--event-color) 20%, transparent), 0 5px 15px #15324538; }
    .marker svg { width: 19px; height: 19px; }
    .marker[data-type="roadwork"] { border-radius: 12px; }
    .marker[data-type="closure"] { border-radius: 10px 10px 10px 2px; transform: translate(-50%,-50%) rotate(-45deg); }
    .marker[data-type="closure"] svg { transform: rotate(45deg); }
    .marker[data-type="congestion"] { border-radius: 13px 13px 13px 4px; transform: translate(-50%,-50%) rotate(45deg); }
    .marker[data-type="congestion"] svg { transform: rotate(-45deg); }
    .marker[data-type="camera"] { width: 38px; height: 38px; border-radius: 50%; }
    .marker[hidden] { display: none; }
    .marker.selected { outline: 3px solid color-mix(in srgb, var(--event-color) 45%, white); outline-offset: 3px; }
    .map-legend { position: absolute; left: 16px; bottom: 18px; display: flex; flex-wrap: wrap; gap: 7px; max-width: calc(100% - 32px); padding: 8px; background: rgba(255,255,255,.95); border: 1px solid #dbe5e8; border-radius: 10px; box-shadow: 0 2px 9px #1a344414; z-index: 1; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; color: #435965; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .legend-mark { width: 9px; height: 9px; border-radius: 50%; background: var(--event-color); }
    .legend-mark.square { border-radius: 2px; }
    .legend-mark.diamond { border-radius: 2px; transform: rotate(45deg); }
    .legend-mark.camera-mark { width: auto; height: auto; background: transparent; color: var(--camera); font-size: 12px; }
    .map-credit { position: absolute; right: 10px; bottom: 8px; color: #657b84; font-size: 8px; text-shadow: 0 1px white; }
    .status-note { position: absolute; top: 60px; left: 50%; display: none; align-items: center; gap: 8px; max-width: min(440px, calc(100% - 32px)); padding: 9px 13px; color: #425965; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); transform: translateX(-50%); font-size: 11px; z-index: 4; }
    .status-note[data-visible="true"] { display: flex; }
    .status-note[data-kind="error"] { color: #8f2b2b; border-color: #efb7b7; }
    .status-note[data-kind="stale"] { color: #795600; border-color: #edd58d; }
    .spinner { width: 14px; height: 14px; border: 2px solid #d5e3e5; border-top-color: var(--route); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .detail-panel { grid-row: 2; min-height: 0; overflow-y: auto; padding: 20px 18px; border-left: 1px solid var(--line); background: #fff; }
    .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .detail-top h2 { margin: 5px 0 0; font-size: 17px; letter-spacing: -.03em; }
    .detail-close { display: none; }
    .detail-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; color: var(--event-color); background: color-mix(in srgb, var(--event-color) 10%, white); border-radius: 6px; font-size: 10px; font-weight: 800; }
    .detail-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .detail-address { margin: 13px 0 5px; color: #354e5b; font-size: 12px; font-weight: 700; }
    .detail-direction { color: var(--muted); font-size: 10px; }
    .detail-rule { height: 1px; margin: 16px 0; background: var(--line); }
    .fact { display: grid; grid-template-columns: 95px 1fr; gap: 8px; padding: 6px 0; font-size: 10px; }
    .fact dt { color: var(--muted); }
    .fact dd { margin: 0; color: #314b58; font-weight: 650; }
    .demo-row { display: inline-flex; padding: 3px 6px; color: #775700; background: #fff2c8; border-radius: 4px; font-size: 9px; font-weight: 850; }
    .advisory { margin-top: 14px; padding: 11px 12px; color: #4f6470; background: #f4f8f8; border-left: 3px solid var(--route); border-radius: 0 8px 8px 0; font-size: 10px; line-height: 1.6; }
    .primary-action { width: 100%; min-height: 42px; margin-top: 14px; color: white; border: 0; border-radius: 9px; background: var(--ink); cursor: pointer; font-size: 11px; font-weight: 750; }
    .primary-action:hover { background: #1b425c; }
    .empty-detail { display: grid; min-height: 230px; place-content: center; justify-items: center; padding: 20px; color: var(--muted); text-align: center; }
    .empty-detail svg { width: 42px; height: 42px; margin-bottom: 12px; color: #86a0a9; }
    .empty-detail strong { margin-bottom: 6px; color: #304a57; font-size: 12px; }
    .empty-detail span { font-size: 10px; line-height: 1.6; }
    .mobile-sheet, .mobile-nav { display: none; }
    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 20; padding: 10px 14px; color: white; background: #17384c; border-radius: 9px; box-shadow: var(--shadow); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .2s ease; font-size: 11px; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1100px) and (min-width: 821px) {
      .app { grid-template-columns: 62px 250px minmax(300px,1fr) 280px; }
      .brand { min-width: 180px; }
      .detail-panel { padding: 18px 14px; }
    }
    @media (max-width: 820px) {
      body { overflow: hidden; }
      .app { display: block; position: relative; width: 100%; height: 100dvh; min-height: 560px; overflow: hidden; }
      .topbar { position: absolute; inset: 0 0 auto; height: 58px; gap: 9px; padding: 0 12px; border: 0; background: rgba(255,255,255,.96); box-shadow: 0 2px 9px #18334212; }
      .brand { min-width: 0; gap: 7px; }
      .brand-mark { width: 32px; height: 32px; }
      .brand-name { font-size: 12px; }
      .brand-name small { font-size: 8px; }
      .search { height: 36px; padding: 0 8px; }
      .search input { font-size: 11px; }
      .search input::placeholder { color: transparent; }
      .search input { min-width: 40px; }
      .top-actions { gap: 5px; }
      .demo-badge { padding: 7px; font-size: 0; }
      .demo-badge::before { width: 8px; height: 8px; }
      .status-select { width: 38px; max-width: 38px; padding: 0; font-size: 0; background-image: none; }
      .status-select option { font-size: 12px; }
      .rail, .sidebar, .detail-panel { display: none; }
      .map-stage { position: absolute; inset: 58px 0 0; }
      .map-topline { top: 11px; left: 10px; right: 52px; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .map-chip { min-height: 32px; padding: 0 9px; font-size: 9px; white-space: nowrap; }
      .map-controls { top: 53px; right: 10px; }
      .map-controls .icon-button { width: 38px; height: 38px; }
      .map-legend { left: 9px; bottom: 196px; gap: 6px; padding: 7px; max-width: calc(100% - 18px); }
      .legend-item { font-size: 8px; }
      .map-label { font-size: 9px; }
      .status-note { top: 52px; font-size: 10px; }
      .mobile-sheet { position: absolute; z-index: 6; left: 0; right: 0; bottom: 66px; display: flex; flex-direction: column; height: 220px; padding: 0 14px 10px; overflow: hidden; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 28px #1532451c; transition: height .22s ease; touch-action: pan-y; }
      .mobile-sheet[data-level="peek"] { height: 220px; }
      .mobile-sheet[data-level="full"] { height: min(62dvh, 490px); }
      .mobile-sheet[data-level="collapsed"] { height: 78px; }
      .sheet-grabber { width: 42px; height: 4px; flex: none; margin: 9px auto 7px; border: 0; border-radius: 999px; background: #c8d4d9; cursor: ns-resize; }
      .sheet-heading { display: flex; align-items: center; justify-content: space-between; min-height: 34px; }
      .sheet-heading strong { font-size: 13px; }
      .sheet-heading span { color: var(--muted); font-size: 9px; }
      .sheet-list { min-height: 0; overflow: auto; }
      .sheet-event { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 1px; border: 0; border-top: 1px solid #edf1f2; background: white; cursor: pointer; text-align: left; }
      .sheet-event .event-copy strong { font-size: 11px; }
      .sheet-event .event-copy small { font-size: 9px; }
      .sheet-event .event-age { margin-left: auto; }
      .sheet-state { display: none; margin: auto 0; padding: 12px; border-radius: 9px; background: #f4f8f8; color: #435b67; font-size: 10px; line-height: 1.5; }
      .mobile-nav { position: absolute; z-index: 8; inset: auto 0 0; height: calc(66px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: flex-start; padding: 6px 8px env(safe-area-inset-bottom); background: white; border-top: 1px solid var(--line); }
      .mobile-nav .nav-item { flex: 1; width: auto; min-height: 48px; font-size: 9px; }
      .detail-mobile { position: absolute; z-index: 10; inset: auto 10px 78px; display: none; max-height: min(55dvh, 420px); overflow-y: auto; padding: 16px; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
      .detail-mobile.open { display: block; }
      .detail-mobile .detail-close { display: inline-grid; width: 32px; height: 32px; }
      .detail-mobile .detail-rule { margin: 11px 0; }
      .detail-mobile .advisory { margin-top: 9px; }
      .detail-mobile .primary-action { margin-top: 9px; }
    }
    @media (max-width: 420px) {
      .brand-name { display: none; }
      .brand { flex: none; }
      .topbar { gap: 7px; }
      .search { flex: 1; }
      .map-chip.optional { display: none; }
      .map-legend { bottom: 193px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Island Pulse 交通地圖原型">
    <header class="topbar">
      <div class="brand" aria-label="Island Pulse 台灣交通">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 16.5c3.5-7 5-7 8.5 0s5 7 9.5 0M5 8c2.5-4 4-4 6.5 0s4 4 7 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="brand-name">Island Pulse<small>台灣交通 DEMO</small></span>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.3 4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="sr-only">搜尋地點或路線</span><input id="searchInput" type="search" placeholder="搜尋地區、道路或車站" autocomplete="off">
      </label>
      <div class="top-actions">
        <span class="demo-badge" title="畫面中的交通資料均為假資料">全部資料皆為 Demo</span>
        <label class="sr-only" for="demoState">切換 Demo 狀態</label>
        <select class="status-select" id="demoState" aria-label="切換 Demo 狀態">
          <option value="ready">Demo 狀態：資料已更新</option>
          <option value="loading">Demo 狀態：載入中</option>
          <option value="empty">Demo 狀態：無資料</option>
          <option value="stale">Demo 狀態：資料過期</option>
          <option value="error">Demo 狀態：連線錯誤</option>
        </select>
        <button class="icon-button theme-button" id="themeButton" type="button" aria-label="切換明暗模式" title="切換明暗模式">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="rail" aria-label="主要導覽">

  <script>
    const events = [
      { id: 'e1', type: 'incident', name: '事故', title: '市民大道口事故', location: '市民大道三段・往東', direction: '忠孝東路口前，內側車道', time: 'Demo 09:36', age: '5 分鐘前', source: 'Demo 假資料', status: '處理中', glyph: '!', note: '事故影響內側車道；路況與處理時間為示意內容。' },
      { id: 'e2', type: 'roadwork', name: '施工', title: '忠孝東路道路施工', location: '忠孝東路四段・往西', direction: '敦化南路至延吉街間', time: 'Demo 09:28', age: '13 分鐘前', source: 'Demo 假資料', status: '單線施工', glyph: '工', note: '施工路段可能需減速通行；此為示意狀態。' },
      { id: 'e3', type: 'closure', name: '封路', title: '和平東路一段封閉', location: '和平東路一段・雙向', direction: '師大路口附近', time: 'Demo 09:20', age: '21 分鐘前', source: 'Demo 假資料', status: '道路封閉', glyph: '×', note: '此封路狀態為 Demo，請勿依此規劃真實行程。' },
      { id: 'e4', type: 'congestion', name: '壅塞', title: '環東大道車流壅塞', location: '環東大道・西向', direction: '南港交流道至成功橋', time: 'Demo 09:40', age: '1 分鐘前', source: 'Demo 假資料', status: '車速緩慢', glyph: '≋', note: '顯示的路況程度與區間均為示意，非即時資訊。' },
      { id: 'e5', type: 'camera', name: '測速照相', title: '建國高架測速照相', location: '建國高架道路・北向', direction: '民權東路出口前（Demo 點位）', time: 'Demo 09:15', age: '26 分鐘前', source: 'Demo 假資料', status: '位置示意', glyph: '⌾', note: '原型只展示圖示；不讀取位置、不進行背景監測或發出提醒。' },
    ];
    const types = [
      { id: 'incident', name: '事故', color: '#d64545', count: 1 },
      { id: 'roadwork', name: '施工', color: '#d9822b', count: 1 },
      { id: 'closure', name: '封路', color: '#7a3e9d', count: 1 },
      { id: 'congestion', name: '壅塞', color: '#b58b00', count: 1 },
      { id: 'camera', name: '測速照相', color: '#2864b4', count: 1 },
    ];
    const stateCopy = {
      ready: { label: 'Demo 更新 09:41｜非即時', note: '', kind: '' },
      loading: { label: 'Demo 載入中｜非即時', note: '<span class="spinner" aria-hidden="true"></span><span>正在整理 Demo 交通資料…</span>', kind: 'loading' },
      empty: { label: 'Demo 無資料｜非即時', note: '<span aria-hidden="true">◌</span><span>此範圍目前沒有可顯示的 Demo 資料。可以重試或切換圖層。</span>', kind: 'empty' },
      stale: { label: 'Demo 資料過期｜09:11', note: '<span aria-hidden="true">◷</span><span>這是過期的 Demo 資料。最後更新 09:11，請勿視為目前交通狀況。</span>', kind: 'stale' },
      error: { label: 'Demo 連線錯誤｜非即時', note: '<span aria-hidden="true">!</span><span>Demo 資料載入失敗。可重試；不影響其他介面操作。</span>', kind: 'error' },
    };
    const activeLayers = new Set(types.map(x => x.id));
    let selectedId = 'e1';
    let currentState = 'ready';
    let toastTimer;
    const eventById = id => events.find(e => e.id === id);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function eventRow(e, mobile = false) {
      return `<button class="${mobile ? 'sheet-event' : 'event-row'}" type="button" data-select="${e.id}" aria-pressed="${selectedId === e.id}" style="--event-color:var(--${e.type === 'camera' ? 'camera' : e.type})">
        <span class="event-glyph" aria-hidden="true">${e.glyph}</span><span class="event-copy"><strong>${e.title}</strong><small>${e.location} · ${e.status} · Demo</small></span><span class="event-age">${e.age}</span></button>`;
    }
    function detailHTML(e) {
      const t = types.find(x => x.id === e.type);
      return `<div class="detail-top"><div><div class="eyebrow">事件詳情 · DEMO</div><h2>${e.title}</h2></div><button class="icon-button detail-close" type="button" data-close-detail aria-label="關閉事件詳情"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
      <div style="margin-top:14px"><span class="detail-tag" style="--event-color:${t.color}">${e.name}</span> <span class="demo-row">DEMO 假資料</span></div>
      <p class="detail-address">${e.location}</p><div class="detail-direction">${e.direction}</div>
      <div class="detail-rule"></div><dl>
        <div class="fact"><dt>事件狀態</dt><dd>${e.status}（示意）</dd></div>
        <div class="fact"><dt>資料更新</dt><dd>${e.time} · 非即時</dd></div>
        <div class="fact"><dt>資料來源</dt><dd>${e.source}</dd></div>
        <div class="fact"><dt>位置／方向</dt><dd>示意點位 · ${e.direction}</dd></div>
      </dl>
      <div class="advisory">${e.note}</div>
      ${e.type === 'camera' ? '<button class="primary-action" type="button" data-toast="此原型不會啟用 GPS 或背景提醒">提醒功能僅展示 · Demo</button>' : '<button class="primary-action" type="button" data-toast="已在 Demo 地圖標示此事件">在地圖上查看 · Demo</button>'}`;
    }
    function renderLayers() {
      document.getElementById('layerList').innerHTML = types.map(t => `<button type="button" class="layer-toggle" data-layer="${t.id}" aria-pressed="${activeLayers.has(t.id)}" style="--event-color:${t.color}" aria-label="${t.name}圖層，${activeLayers.has(t.id) ? '顯示中' : '已隱藏'}"><i class="dot" aria-hidden="true"></i><span class="label">${t.name}</span><span class="count">${t.count}</span><i class="switch" aria-hidden="true"></i></button>`).join('');
      document.querySelectorAll('.marker').forEach(m => m.hidden = !activeLayers.has(m.dataset.type) || currentState === 'empty' || currentState === 'error');
      updateCount();
    }
    function renderSelection() {
      const e = eventById(selectedId) || events[0];
      document.getElementById('desktopDetail').innerHTML = detailHTML(e);
      document.getElementById('mobileDetail').innerHTML = detailHTML(e);
      document.querySelectorAll('[data-select]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.select === e.id)));
      document.querySelectorAll('.marker').forEach(m => m.classList.toggle('selected', m.dataset.id === e.id));
    }
    function renderLists() {
      const visible = events.filter(e => activeLayers.has(e.type));
      const unavailable = currentState === 'empty' || currentState === 'error';
      document.getElementById('eventList').innerHTML = unavailable
        ? `<div class="empty-detail"><strong>${currentState === 'empty' ? '目前沒有可用資料' : '資料暫時無法載入'}</strong><span>${currentState === 'empty' ? '這是 Demo 空資料狀態。' : '這是 Demo 錯誤狀態。'}<br><button class="quiet-button" type="button" data-retry>重試 Demo</button></span></div>`
        : (visible.length ? visible.map(e => eventRow(e)).join('') : '<div class="empty-detail"><strong>沒有選取的圖層</strong><span>開啟至少一個圖層以查看 Demo 事件。</span></div>');
      document.getElementById('sheetList').innerHTML = visible.map(e => eventRow(e, true)).join('');
      document.getElementById('sheetList').style.display = unavailable ? 'none' : 'block';
      renderSelection(); updateCount();
    }
    function updateCount() {
      const count = events.filter(e => activeLayers.has(e.type)).length;
      const label = currentState === 'empty' ? '0 項可用 · Demo' : `${count} 項 Demo`;
      document.getElementById('eventCount').textContent = label;
      document.getElementById('sheetMeta').textContent = label;
    }
    function setState(state) {
      currentState = state;
      if (state === 'ready') document.getElementById('demoState').value = 'ready';
      const info = stateCopy[state];
      const note = document.getElementById('statusNote');
      note.innerHTML = info.note;
      note.dataset.visible = String(Boolean(info.note));
      note.dataset.kind = info.kind;
      document.getElementById('mapStatusText').textContent = info.label;
      document.getElementById('sheetState').style.display = state === 'ready' ? 'none' : 'block';
      document.getElementById('sheetState').innerHTML = info.note ? `${info.note}${state === 'error' || state === 'empty' ? '<br><button class="quiet-button" type="button" data-retry>重試 Demo</button>' : ''}` : '';
      document.getElementById('sheetList').style.display = state === 'empty' || state === 'error' ? 'none' : 'block';
      document.querySelectorAll('.marker').forEach(m => m.hidden = !activeLayers.has(m.dataset.type) || state === 'empty' || state === 'error');
      renderLists(); updateCount();
    }
    function showToast(message) {
      const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    function selectEvent(id) {
      if (!eventById(id)) return;
      selectedId = id; renderSelection();
      if (window.matchMedia('(max-width: 820px)').matches) {
        document.getElementById('mobileDetail').classList.add('open');
        document.getElementById('mobileSheet').dataset.level = 'collapsed';
      }
    }

    renderLayers(); renderLists(); setState('ready');
    document.addEventListener('click', event => {
      const layer = event.target.closest('[data-layer]');
      if (layer) {
        const id = layer.dataset.layer;
        if (activeLayers.has(id)) activeLayers.delete(id); else activeLayers.add(id);
        renderLayers(); renderLists();
      }
      const select = event.target.closest('[data-select]'); if (select) selectEvent(select.dataset.select);
      const marker = event.target.closest('.marker'); if (marker) selectEvent(marker.dataset.id);
      if (event.target.closest('[data-close-detail]')) { document.getElementById('mobileDetail').classList.remove('open'); document.getElementById('mobileSheet').dataset.level = 'peek'; }
      if (event.target.closest('[data-toast]')) showToast(event.target.closest('[data-toast]').dataset.toast);
      if (event.target.closest('[data-retry]')) { setState('loading'); setTimeout(() => setState('ready'), 900); }
    });
    document.querySelectorAll('.marker').forEach(marker => marker.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectEvent(marker.dataset.id); } }));
    document.getElementById('demoState').addEventListener('change', e => setState(e.target.value));
    document.getElementById('resetLayers').addEventListener('click', () => { types.forEach(t => activeLayers.add(t.id)); renderLayers(); renderLists(); });
    document.getElementById('sheetGrabber').addEventListener('click', () => {
      const sheet = document.getElementById('mobileSheet');
      const levels = ['peek','full','collapsed']; sheet.dataset.level = levels[(levels.indexOf(sheet.dataset.level) + 1) % levels.length];
      document.getElementById('sheetGrabber').setAttribute('aria-expanded', String(sheet.dataset.level !== 'collapsed'));
    });
    let touchY = null;
    document.getElementById('mobileSheet').addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    document.getElementById('mobileSheet').addEventListener('touchend', e => {
      if (touchY === null) return;
      const dy = e.changedTouches[0].clientY - touchY; const sheet = document.getElementById('mobileSheet');
      if (Math.abs(dy) > 32) { sheet.dataset.level = dy < 0 ? 'full' : (sheet.dataset.level === 'full' ? 'peek' : 'collapsed'); document.getElementById('sheetGrabber').setAttribute('aria-expanded', String(sheet.dataset.level !== 'collapsed')); }
      touchY = null;
    }, { passive: true });
    document.getElementById('themeButton').addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      showToast(dark ? '原型切換至深色地圖示意' : '原型切換至淺色地圖示意');
    });
    const darkStyle = document.createElement('style');
    darkStyle.textContent = `:root[data-theme="dark"] { --canvas:#0b1722; --panel:#142433; --text:#f3f7fa; --muted:#b4c3cd; --line:#344a59; --shadow:0 12px 36px #0006; color-scheme:dark } :root[data-theme="dark"] .topbar,:root[data-theme="dark"] .sidebar,:root[data-theme="dark"] .detail-panel,:root[data-theme="dark"] .mobile-sheet,:root[data-theme="dark"] .mobile-nav { background:#142433; color:#f3f7fa; border-color:#344a59 } :root[data-theme="dark"] .rail { background:#101f2d; border-color:#344a59 } :root[data-theme="dark"] .search,:root[data-theme="dark"] .layer-toggle,:root[data-theme="dark"] .icon-button,:root[data-theme="dark"] .status-select { color:#edf4f7; background:#1c3040; border-color:#385061 } :root[data-theme="dark"] .map-canvas { filter:brightness(.73) saturate(.82) } :root[data-theme="dark"] .map-chip,:root[data-theme="dark"] .map-legend,:root[data-theme="dark"] .status-note { color:#eaf2f5; background:#142433; border-color:#344a59 } :root[data-theme="dark"] .layer-toggle[aria-pressed="true"],:root[data-theme="dark"] .event-row[aria-pressed="true"] { background:#1d3d48; border-color:#327477 } :root[data-theme="dark"] .event-row:hover,:root[data-theme="dark"] .layer-toggle:hover { background:#1c3040 } :root[data-theme="dark"] .sheet-event { color:#edf4f7; background:#142433; border-color:#344a59 } :root[data-theme="dark"] .detail-address,:root[data-theme="dark"] .fact dd,:root[data-theme="dark"] .empty-detail strong { color:#edf4f7 } :root[data-theme="dark"] .advisory,:root[data-theme="dark"] .sheet-state { color:#d3e0e6; background:#1c3040 }`;
    document.head.append(darkStyle);
    document.querySelectorAll('[data-nav]').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('[data-nav]').forEach(b => b.removeAttribute('aria-current')); document.querySelectorAll(`[data-nav="${button.dataset.nav}"]`).forEach(b => b.setAttribute('aria-current','page'));
      if (button.dataset.nav !== '地圖') showToast(`${button.dataset.nav}入口為導覽示意，原型目前聚焦交通地圖`);
    }));
    document.querySelector('.locate-button').addEventListener('click', () => showToast('定位控制為 Demo，不會讀取裝置位置'));
    document.querySelector('.layer-button').addEventListener('click', () => { if (window.matchMedia('(max-width: 820px)').matches) { document.getElementById('mobileSheet').dataset.level = 'full'; document.getElementById('sheetGrabber').focus(); } else document.querySelector('[data-layer="incident"]').focus(); });
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter' && e.currentTarget.value.trim()) showToast(`「${e.currentTarget.value.trim()}」為搜尋 Demo，尚未連接地點服務`); });
  </script>
</body>
</html>
